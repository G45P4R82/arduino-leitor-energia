name: iot004

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "iot004-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install EmonLib Ethernet SSLClient

      - name: Compile iot004
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=default \
            --export-binaries codigo/iot004

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iot004-build-${{ github.sha }}
          path: codigo/iot004/build/esp32.esp32.esp32/

  release:
    if: startsWith(github.ref, 'refs/tags/iot004-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "The iot004 tag must point to a commit already merged into main."
            exit 1
          }

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install EmonLib Ethernet SSLClient

      - name: Compile release firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=default \
            --export-binaries codigo/iot004
          mkdir -p release
          cp codigo/iot004/build/esp32.esp32.esp32/iot004.ino.bin release/iot004.bin

      - name: Generate manifest and checksum
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          sha256sum release/iot004.bin > release/iot004.sha256
          SHA256=$(cut -d ' ' -f 1 release/iot004.sha256)
          cat > release/manifest.json <<EOF
          {
            "device": "iot004",
            "version": "${TAG#iot004-}",
            "firmware_url": "https://github.com/${REPOSITORY}/releases/download/${TAG}/iot004.bin",
            "sha256": "${SHA256}",
            "signature_file": "iot004.manifest.sig"
          }
          EOF

      - name: Sign manifest
        env:
          OTA_SIGNING_KEY: ${{ secrets.IOT004_OTA_SIGNING_KEY }}
        run: |
          test -n "$OTA_SIGNING_KEY" || { echo "Configure IOT004_OTA_SIGNING_KEY"; exit 1; }
          printf '%s' "$OTA_SIGNING_KEY" > /tmp/iot004-signing.pem
          openssl dgst -sha256 -sign /tmp/iot004-signing.pem \
            -out release/iot004.manifest.sig release/manifest.json
          rm -f /tmp/iot004-signing.pem

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/iot004.bin \
            release/iot004.sha256 \
            release/manifest.json \
            release/iot004.manifest.sig \
            --repo "${{ github.repository }}" \
            --generate-notes
